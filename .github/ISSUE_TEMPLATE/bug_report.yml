name: Bug report / 問題回報
description: Report something that does not work as expected. / 回報未如預期運作的問題。
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach your own private photos, videos or travel data. Use sample files instead.
        請勿附上您本人的私人照片、影片或旅行資料，請改用範例檔案。
  - type: textarea
    id: description
    attributes:
      label: Description / 問題說明
      description: What happened? / 發生了什麼問題？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 重現步驟
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 預期行為
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform / 平台
      multiple: true
      options:
        - Web
        - Windows
        - macOS
        - Linux
        - Android
        - iOS
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version and environment / 版本與環境
      description: App version or commit, OS version, browser and device model. / 應用程式版本或 commit、作業系統版本、瀏覽器及裝置型號。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / 日誌
      description: Remove any local paths or personal information before pasting. / 貼上前請移除本機路徑及個人資訊。
      render: text
