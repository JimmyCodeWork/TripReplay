name: Feature request / 功能建議
description: Suggest a new feature or an improvement. / 建議新功能或改善項目。
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / 問題描述
      description: What problem would this solve? / 此功能要解決什麼問題？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution / 建議做法
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 曾考慮的替代方案
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy / 隱私
      options:
        - label: This feature does not require sending private data off the device. / 此功能不需要將私人資料傳送至裝置以外。
          required: true
