name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type check, test and license check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm run verify

      - name: Build the Web application
        run: pnpm run build

      - name: Install Chromium for browser tests
        run: pnpm --filter @tripreplay/storage exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm run test:browser

  android:
    name: Android application
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the page and the Android project
        # Fails when a bundled package has not passed the license review (docs/license-policy.md §6).
        run: |
          pnpm run build:native
          pnpm --filter @tripreplay/android exec cap sync android

      - name: Check the Android libraries and write the notices
        # Fails when a Maven library has not passed the license review; the log lists them all.
        working-directory: apps/android/android
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          ./gradlew --no-daemon -q :app:dependencies --configuration releaseRuntimeClasspath > build/gradle-dependencies.txt
          cd ../../..
          node tools/release/src/android.ts --gradle apps/android/android/build/gradle-dependencies.txt \
            --components apps/android/android/build/web-components.json \
            --assets apps/android/android/app/src/main/assets/public

      - name: Build the APK
        working-directory: apps/android/android
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          ./gradlew --no-daemon assembleDebug

      - name: Keep the APK for testing on a device
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tripreplay-android-debug
          path: apps/android/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
